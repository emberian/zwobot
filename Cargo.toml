[workspace]
resolver = "2"
members = [
    "crates/tulip-bot",
    "crates/tulip-mcp",
    "crates/llm",
    "crates/debate",
    "crates/spweencraft",
    "crates/rhai-games",
    "crates/rpg",
    "crates/zwobot",
    "crates/playground-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ron = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# LLM
mistralrs = { git = "https://github.com/ericlbuehler/mistral.rs", features = ["metal"] }

# Internal crates
tulip-bot = { path = "crates/tulip-bot" }
llm = { path = "crates/llm" }
debate = { path = "crates/debate" }
spweencraft = { path = "crates/spweencraft" }
rhai-games = { path = "crates/rhai-games" }
rpg = { path = "crates/rpg" }
