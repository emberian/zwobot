[package]
name = "playground-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM playground for testing game widgets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Use the local tulip-bot crate for widget types (without runtime dependencies)
tulip-bot = { path = "../tulip-bot", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
