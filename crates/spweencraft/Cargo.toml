[package]
name = "spweencraft"
version = "0.1.0"
edition = "2024"

[dependencies]
spween = { git = "https://github.com/spwplace/spween", features = ["serde"] }
tulip-bot = { path = "../tulip-bot" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
smol_str = "0.3"
thiserror = "2"

[dependencies.futures]
version = "0.3"
default-features = false
features = ["async-await"]
