# Zwobot Debate Club Configuration

# Zulip settings (credentials come from zuliprc file)
channel = "clankerville"

# Debate opponent model (medium-sized LLM that debates against the human)
[debate_opponent]
model_id = "Qwen/Qwen2.5-1.5B-Instruct"
quantization = "Q4_K_M"
max_tokens = 512
temperature = 0.8

# Debate judge model (larger LLM that judges the debate)
[debate_judge]
model_id = "Qwen/Qwen2.5-3B-Instruct"
quantization = "Q4_K_M"
max_tokens = 1024
temperature = 0.5

# Image generation model (FLUX.1)
[image_model]
model_id = "black-forest-labs/FLUX.1-schnell"
offloaded = false  # Set true for ~4GB VRAM, false for ~33GB (faster)
default_width = 1280
default_height = 720

# Cinnamon Toast Crunch Detector
# Watches every message and asks an LLM if it's "the reason why kids love
# Cinnamon Toast Crunch", then uses constrained decoding to evaluate if the
# answer was affirmative. If so, responds as a puppet character.
[ctc_detector]
puppet_name = "Cinnamon Toast Crunch Detective"
channel = "general"

[ctc_detector.question_model]
model_id = "Qwen/Qwen3-1.7B"
quantization = "Q4_K_M"
max_tokens = 512
temperature = 0.7

[ctc_detector.evaluator_model]
model_id = "google/gemma-3-270m-it"
quantization = "Q4_K_M"
max_tokens = 8
temperature = 0.0

# Topic to model mappings (optional overrides)
[topics]

# Default model configuration for topics not explicitly configured
[default_topic]
model_id = "Qwen/Qwen3-0.6B"
quantization = "Q8_0"
max_tokens = 1024
temperature = 0.7
