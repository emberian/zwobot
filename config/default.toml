# Zwobot Debate Club Configuration

# Zulip settings (credentials come from zuliprc file)
channel = "clankerville"

# Debate opponent model (medium-sized LLM that debates against the human)
[debate_opponent]
model_id = "Qwen/Qwen2.5-1.5B-Instruct"
quantization = "Q4_K_M"
max_tokens = 512
temperature = 0.8

# Debate judge model (larger LLM that judges the debate)
[debate_judge]
model_id = "Qwen/Qwen2.5-3B-Instruct"
quantization = "Q4_K_M"
max_tokens = 1024
temperature = 0.5

# Topic to model mappings (optional overrides)
[topics]

# Default model configuration for topics not explicitly configured
[default_topic]
model_id = "Qwen/Qwen3-0.6B"
quantization = "Q8_0"
max_tokens = 1024
temperature = 0.7
